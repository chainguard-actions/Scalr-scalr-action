name: Test

on:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: Scalr/scalr-action@4c733082797bb784df21ec396fdb36949f6b68b6 # v1
        with:
          terraform_version: '1.3.7'
          scalr_token: ${{ secrets.SCALR_TOKEN }}
          scalr_hostname: 'test.scalr.io'

      - id: version
        name: Terraform version
        run: terraform -v

      - id: cli-version
        name: Scalr CLI version
        run: scalr -version
