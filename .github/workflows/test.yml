name: Test

on:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]    

    steps:
      - uses: Scalr/scalr-action@5549b00767d270f1f09c4c8d9e8add72a7b4d7d4 # v1.4.0
        with:
          terraform_version: '1.3.7'
          scalr_token: ${{ secrets.SCALR_TOKEN }}
          scalr_hostname: 'test.scalr.io'

      - id: version
        name: Terraform version
        run: terraform -v

      - id: cli-version
        name: Scalr CLI version
        run: scalr -version
