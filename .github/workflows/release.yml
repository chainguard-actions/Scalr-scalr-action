name: Build dist files and release

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: Version for new release
        required: true
        default: 0.0.0

jobs:
  build:
    name: Build dist files and release
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.4"

      - name: Validate release branch
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "master" || {
            echo "This workflow can only be run from master. Current ref: ${GITHUB_REF_NAME}"
            exit 1
          }

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Build dist files
        run: bun run build

      - name: Normalize generated wrapper permissions
        shell: bash
        run: |
          chmod +x dist/wrapper/index.js
          git update-index --chmod=+x dist/wrapper/index.js

      - name: Verify generated files are committed
        shell: bash
        run: |
          if ! git diff --exit-code -- dist bun.lock; then
            echo "Generated files are out of date. Commit dist/ and bun.lock before releasing."
            echo
            echo "Generated diff:"
            git diff -- dist bun.lock || true
            exit 1
          fi

      - name: Fetch tags
        shell: bash
        run: git fetch --tags --force

      - name: Ensure release tag does not already exist
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          if git rev-parse "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "Tag v${RELEASE_VERSION} already exists"
            exit 1
          fi

      - name: Create and push release tag
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          git config --global user.email "github@scalr.com"
          git config --global user.name "Github Action"
          git tag -a "v${RELEASE_VERSION}" -m "Release v${RELEASE_VERSION}"
          git push origin "v${RELEASE_VERSION}"

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          gh release create "v${RELEASE_VERSION}" --generate-notes
