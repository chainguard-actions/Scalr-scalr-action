name: Test OpenTofu platform usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          scalr_hostname: "myorg.scalr.io"
          scalr_token: "test-token-opentofu"
          iac_platform: "tofu"
          binary_version: "1.7.0"
          binary_wrapper: "false"

      - name: Assert tofu binary is on PATH
        run: |
          echo "PATH=$PATH"
          echo "Checking tofu binary..."
          if ! which tofu; then
            echo "FAIL: tofu not found on PATH"
            exit 1
          fi
          echo "PASS: tofu found on PATH at $(which tofu)"

      - name: Assert tofu version
        run: |
          echo "Running tofu version..."
          TOFU_VERSION=$(tofu version 2>&1 | head -5)
          echo "actual version output: $TOFU_VERSION"
          if echo "$TOFU_VERSION" | grep -q "1.7.0"; then
            echo "PASS: tofu version 1.7.0 found"
          else
            echo "FAIL: expected tofu 1.7.0 but got: $TOFU_VERSION"
            exit 1
          fi

      - name: Assert scalr CLI is on PATH
        run: |
          echo "Checking scalr binary..."
          if ! which scalr; then
            echo "FAIL: scalr not found on PATH"
            exit 1
          fi
          echo "PASS: scalr found on PATH at $(which scalr)"

      - name: Assert Scalr credentials file was created with correct hostname
        run: |
          SCALR_CONF="$HOME/.scalr/scalr.conf"
          echo "Checking Scalr credentials file at $SCALR_CONF"
          if [ ! -f "$SCALR_CONF" ]; then
            echo "FAIL: Scalr credentials file not found at $SCALR_CONF"
            echo "Contents of $HOME/.scalr (if exists):"
            ls -la "$HOME/.scalr" 2>/dev/null || echo "(directory does not exist)"
            exit 1
          fi
          echo "File contents:"
          cat "$SCALR_CONF"
          if grep -q "myorg.scalr.io" "$SCALR_CONF"; then
            echo "PASS: hostname found in credentials file"
          else
            echo "FAIL: hostname not found in credentials file"
            exit 1
          fi

      - name: Assert OpenTofu credentials file was created
        run: |
          # OpenTofu uses .tofurc (iacPlatform=tofu -> ~/.tofurc)
          TOFU_RC="$HOME/.tofurc"
          echo "Checking OpenTofu credentials file at $TOFU_RC"
          echo "Home directory contents:"
          ls -la "$HOME/" 2>/dev/null
          if [ ! -f "$TOFU_RC" ]; then
            echo "FAIL: OpenTofu credentials file not found at $TOFU_RC"
            exit 1
          fi
          echo "PASS: OpenTofu credentials file exists"
          echo "File contents:"
          cat "$TOFU_RC"
          if grep -q "myorg.scalr.io" "$TOFU_RC"; then
            echo "PASS: hostname found in tofu credentials file"
          else
            echo "FAIL: hostname not found in tofu credentials file"
            exit 1
          fi

      - name: Assert TF_IN_AUTOMATION env var is set
        run: |
          echo "TF_IN_AUTOMATION=$TF_IN_AUTOMATION"
          if [ "$TF_IN_AUTOMATION" = "TRUE" ]; then
            echo "PASS: TF_IN_AUTOMATION is set to TRUE"
          else
            echo "FAIL: expected TF_IN_AUTOMATION=TRUE but got: '$TF_IN_AUTOMATION'"
            exit 1
          fi
