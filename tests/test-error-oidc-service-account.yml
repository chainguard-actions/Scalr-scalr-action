name: Test OIDC service account auth fails gracefully without OIDC
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          scalr_hostname: example.invalid
          scalr_service_account_email: test-sa@example.invalid
          scalr_oidc_audience: https://example.invalid
          binary_version: 1.5.7
      - name: Assert action failed during OIDC authentication
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure (no OIDC provider / unreachable Scalr host)"
            exit 1
          fi
          if command -v terraform-bin >/dev/null 2>&1; then
            echo "FAIL: terraform should not have been installed"
            exit 1
          fi
          echo "PASS"
