name: Test workspace name and environment name inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          scalr_hostname: "example.scalr.io"
          scalr_token: "fake-token-for-testing"
          scalr_workspace_name: "my-workspace"
          scalr_environment_name: "my-environment"
          binary_version: "1.9.0"
          iac_platform: "terraform"
          binary_wrapper: "false"
      - name: Assert terraform is installed
        run: |
          echo "Checking terraform binary is available..."
          if ! command -v terraform &>/dev/null; then
            echo "FAIL: terraform binary not found in PATH"
            exit 1
          fi
          echo "PASS: terraform binary is installed with workspace_name and environment_name inputs"
