name: Test workspace and deprecated terraform_version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          scalr_hostname: "example.scalr.io"
          scalr_token: "fake-token-for-testing"
          scalr_workspace: "ws-fake123456"
          terraform_version: "1.8.0"
          iac_platform: "terraform"
          binary_wrapper: "false"
          binary_output: "false"
      - name: Assert terraform is installed with specified version
        run: |
          echo "Checking terraform binary is installed..."
          if ! command -v terraform &> /dev/null; then
            echo "FAIL: terraform binary not found"
            exit 1
          fi
          TF_VERSION=$(terraform version | head -1)
          echo "Terraform version: $TF_VERSION"
          echo "PASS"
