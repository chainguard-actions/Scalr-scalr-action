name: Test error when workspace id and name both given
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          scalr_hostname: example.scalr.io
          scalr_token: test-scalr-token-123
          scalr_workspace: ws-abc123
          scalr_workspace_name: my-ws
          scalr_environment_name: my-env
          binary_version: 1.5.7
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for conflicting workspace inputs"
            exit 1
          fi
          echo "PASS"
