name: Test basic Terraform install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          scalr_hostname: "test.scalr.io"
          scalr_token: "test-token-12345"
          iac_platform: "terraform"
          binary_version: "1.5.7"
          binary_wrapper: "false"

      - name: Check action outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: action did not succeed (outcome=$OUTCOME)"
            exit 1
          fi
          echo "PASS: action succeeded"

      - name: Assert terraform binary is installed
        run: |
          echo "Checking terraform binary..."
          if ! command -v terraform >/dev/null 2>&1; then
            echo "FAIL: terraform binary not found in PATH"
            exit 1
          fi
          echo "PASS: terraform binary found at $(command -v terraform)"

      - name: Assert terraform version
        run: |
          echo "Running: terraform version"
          terraform version || true
          VERSION=$(terraform version 2>&1 | head -1)
          echo "actual version output: $VERSION"
          if ! echo "$VERSION" | grep -q "1.5.7"; then
            echo "FAIL: expected terraform version 1.5.7, got: $VERSION"
            exit 1
          fi
          echo "PASS: terraform version is 1.5.7"

      - name: Assert Scalr credentials file exists
        run: |
          CREDS_FILE="$HOME/.scalr/scalr.conf"
          echo "Checking $CREDS_FILE..."
          if [ ! -f "$CREDS_FILE" ]; then
            echo "FAIL: Scalr credentials file not found at $CREDS_FILE"
            echo "HOME=$HOME"
            ls -la "$HOME/" 2>/dev/null || true
            ls -la "$HOME/.scalr/" 2>/dev/null || true
            exit 1
          fi
          echo "PASS: Scalr credentials file exists"
          cat "$CREDS_FILE"

      - name: Assert Terraform credentials file exists
        run: |
          RC_FILE="$HOME/.terraformrc"
          echo "Checking $RC_FILE..."
          if [ ! -f "$RC_FILE" ]; then
            echo "FAIL: .terraformrc not found at $RC_FILE"
            echo "HOME=$HOME"
            ls -la "$HOME/" 2>/dev/null || true
            exit 1
          fi
          echo "PASS: .terraformrc exists"
          if ! grep -q "test.scalr.io" "$RC_FILE"; then
            echo "FAIL: .terraformrc does not contain the hostname"
            cat "$RC_FILE"
            exit 1
          fi
          echo "PASS: .terraformrc contains correct hostname"

      - name: Assert TF_IN_AUTOMATION env var is set
        run: |
          echo "TF_IN_AUTOMATION=$TF_IN_AUTOMATION"
          if [ "$TF_IN_AUTOMATION" != "TRUE" ]; then
            echo "FAIL: expected TF_IN_AUTOMATION=TRUE, got: '$TF_IN_AUTOMATION'"
            exit 1
          fi
          echo "PASS: TF_IN_AUTOMATION is set correctly"
