name: Test basic Terraform install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          scalr_hostname: "test.scalr.io"
          scalr_token: "test-token-12345"
          iac_platform: "terraform"
          binary_version: "1.5.7"
          binary_wrapper: "false"

      - name: Assert terraform binary is on PATH
        run: |
          echo "Checking terraform binary..."
          if ! command -v terraform >/dev/null 2>&1; then
            echo "FAIL: terraform binary not found on PATH"
            exit 1
          fi
          echo "PASS: terraform binary found at $(command -v terraform)"

      - name: Assert terraform version matches requested
        run: |
          VERSION_OUTPUT=$(terraform version 2>&1 || true)
          echo "terraform version output: $VERSION_OUTPUT"
          if ! echo "$VERSION_OUTPUT" | grep -q "1.5.7"; then
            echo "FAIL: expected terraform version 1.5.7 in output"
            exit 1
          fi
          echo "PASS: terraform version 1.5.7 confirmed"

      - name: Assert Scalr credentials file was created
        run: |
          CONF="$HOME/.scalr/scalr.conf"
          echo "Checking Scalr credentials file at $CONF"
          if [ ! -f "$CONF" ]; then
            echo "FAIL: Scalr credentials file not found at $CONF"
            exit 1
          fi
          echo "PASS: Scalr credentials file exists"
          # Verify hostname is in the file
          if ! grep -q "test.scalr.io" "$CONF"; then
            echo "FAIL: hostname not found in credentials file"
            exit 1
          fi
          echo "PASS: hostname found in credentials file"

      - name: Assert Terraform credentials file was created
        run: |
          RC="$HOME/.terraformrc"
          echo "Checking Terraform credentials file at $RC"
          if [ ! -f "$RC" ]; then
            echo "FAIL: Terraform credentials file not found at $RC"
            exit 1
          fi
          echo "PASS: Terraform credentials file exists"
          if ! grep -q "test.scalr.io" "$RC"; then
            echo "FAIL: hostname not found in terraform credentials file"
            exit 1
          fi
          echo "PASS: hostname found in terraform credentials file"

      - name: Assert TF_IN_AUTOMATION env var is set
        run: |
          echo "TF_IN_AUTOMATION=$TF_IN_AUTOMATION"
          if [ "$TF_IN_AUTOMATION" != "TRUE" ]; then
            echo "FAIL: expected TF_IN_AUTOMATION=TRUE"
            exit 1
          fi
          echo "PASS: TF_IN_AUTOMATION is set to TRUE"
