name: Test deprecated terraform_version and terraform_output inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          scalr_hostname: example.scalr.io
          scalr_token: test-scalr-token-123
          terraform_version: 1.5.7
      - name: Assert terraform installed via deprecated input
        run: |
          OUT="$(terraform version)"
          echo "$OUT"
          echo "$OUT" | grep -q "Terraform v1.5.7" || { echo "FAIL: expected v1.5.7"; exit 1; }
          echo "PASS"
