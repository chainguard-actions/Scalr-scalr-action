name: Test deprecated terraform_version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          scalr_hostname: "test.scalr.io"
          scalr_token: "fake-scalr-token"
          iac_platform: "terraform"
          terraform_version: "1.8.0"
          binary_wrapper: "false"

      - name: Assert terraform is installed at the version specified via terraform_version
        run: |
          echo "Checking terraform binary (installed via deprecated terraform_version input)..."
          which terraform
          TF_VERSION=$(terraform version | head -1)
          echo "terraform version: $TF_VERSION"
          if ! terraform version | grep -q "1.8.0"; then
            echo "FAIL: expected terraform 1.8.0 to be installed (via deprecated terraform_version)"
            exit 1
          fi
          echo "PASS: terraform 1.8.0 is installed via deprecated terraform_version input"

      - name: Assert scalr CLI is installed
        run: |
          echo "Checking scalr CLI binary..."
          which scalr
          echo "PASS: scalr CLI is installed"

      - name: Assert Scalr credentials file exists
        run: |
          CREDS_FILE="$HOME/.scalr/scalr.conf"
          echo "Checking credentials file at $CREDS_FILE"
          if [ ! -f "$CREDS_FILE" ]; then
            echo "FAIL: Scalr credentials file not found at $CREDS_FILE"
            exit 1
          fi
          echo "Contents: $(cat $CREDS_FILE)"
          if ! grep -q "test.scalr.io" "$CREDS_FILE"; then
            echo "FAIL: hostname not found in credentials file"
            exit 1
          fi
          echo "PASS: Scalr credentials file exists with correct hostname"

      - name: Assert Terraform credentials file exists
        run: |
          TFRC_FILE="$HOME/.terraformrc"
          echo "Checking Terraform credentials file at $TFRC_FILE"
          if [ ! -f "$TFRC_FILE" ]; then
            echo "FAIL: Terraform credentials file not found at $TFRC_FILE"
            exit 1
          fi
          if ! grep -q "test.scalr.io" "$TFRC_FILE"; then
            echo "FAIL: hostname not found in Terraform credentials file"
            exit 1
          fi
          echo "PASS: Terraform credentials file exists with correct hostname"

      - name: Assert TF_IN_AUTOMATION is set
        run: |
          echo "TF_IN_AUTOMATION=$TF_IN_AUTOMATION"
          if [ "$TF_IN_AUTOMATION" != "TRUE" ]; then
            echo "FAIL: expected TF_IN_AUTOMATION=TRUE"
            exit 1
          fi
          echo "PASS: TF_IN_AUTOMATION is set to TRUE"
