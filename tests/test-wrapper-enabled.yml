name: Test wrapper enabled (default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          scalr_hostname: "myorg.scalr.io"
          scalr_token: "fake-scalr-token"
          iac_platform: "terraform"
          binary_version: "1.9.0"
          binary_wrapper: "true"

      - name: Assert terraform wrapper is installed
        run: |
          echo "Checking terraform binary (wrapper)..."
          TF_PATH=$(which terraform)
          echo "terraform path: $TF_PATH"
          if [ -z "$TF_PATH" ]; then
            echo "FAIL: terraform not found in PATH"
            exit 1
          fi
          echo "PASS: terraform wrapper is on PATH"

      - name: Assert terraform-bin exists alongside wrapper
        run: |
          TF_PATH=$(which terraform)
          TF_DIR=$(dirname "$TF_PATH")
          TF_BIN="$TF_DIR/terraform-bin"
          echo "Looking for terraform-bin at $TF_BIN"
          if [ ! -f "$TF_BIN" ]; then
            echo "FAIL: terraform-bin not found at $TF_BIN (wrapper was not installed)"
            exit 1
          fi
          echo "PASS: terraform-bin exists alongside wrapper"

      - name: Assert scalr CLI is installed
        run: |
          echo "Checking scalr CLI binary..."
          which scalr
          echo "PASS: scalr CLI is installed"

      - name: Assert Scalr credentials file exists
        run: |
          CREDS_FILE="$HOME/.scalr/scalr.conf"
          echo "Checking credentials file at $CREDS_FILE"
          if [ ! -f "$CREDS_FILE" ]; then
            echo "FAIL: Scalr credentials file not found at $CREDS_FILE"
            exit 1
          fi
          if ! grep -q "myorg.scalr.io" "$CREDS_FILE"; then
            echo "FAIL: hostname not found in credentials file"
            exit 1
          fi
          echo "PASS: Scalr credentials file exists with correct hostname"

      - name: Assert Terraform credentials file exists
        run: |
          TFRC_FILE="$HOME/.terraformrc"
          echo "Checking Terraform credentials file at $TFRC_FILE"
          if [ ! -f "$TFRC_FILE" ]; then
            echo "FAIL: Terraform credentials file not found at $TFRC_FILE"
            exit 1
          fi
          if ! grep -q "myorg.scalr.io" "$TFRC_FILE"; then
            echo "FAIL: hostname not found in Terraform credentials file"
            exit 1
          fi
          echo "PASS: Terraform credentials file exists with correct hostname"
