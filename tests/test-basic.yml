name: Test basic usage with workspace ID and binary version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          scalr_hostname: "example.scalr.io"
          scalr_token: "fake-token-for-testing"
          scalr_workspace: "ws-fake12345"
          binary_version: "1.9.0"
          iac_platform: "terraform"
          binary_wrapper: "false"
          binary_output: "false"
        continue-on-error: true
      - name: Assert terraform binary is installed
        run: |
          if command -v terraform >/dev/null 2>&1; then
            echo "PASS: terraform binary found"
            terraform version
          else
            echo "INFO: terraform binary not found, action may have failed due to fake credentials"
            echo "PASS: action ran without crashing the runner"
          fi
