name: Test basic terraform setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          scalr_hostname: "test.scalr.io"
          scalr_token: "test-token-placeholder"
          iac_platform: "terraform"
          binary_version: "1.5.0"
          binary_wrapper: "false"
          binary_output: "false"
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step executed"
