name: Test basic usage with binary_version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          scalr_hostname: "example.scalr.io"
          scalr_token: "fake-token-for-testing"
          scalr_workspace: "ws-fake123"
          binary_version: "1.9.0"
          binary_wrapper: "false"
          iac_platform: "terraform"
      - name: Assert terraform is installed
        run: |
          echo "Checking terraform binary is available..."
          which terraform || { echo "FAIL: terraform not found in PATH"; exit 1; }
          TF_VERSION=$(terraform version -json 2>/dev/null | grep -o '"terraform_version":"[^"]*"' | head -1 | cut -d'"' -f4 || terraform version | head -1)
          echo "Terraform version: $TF_VERSION"
          echo "PASS: terraform binary is installed"
