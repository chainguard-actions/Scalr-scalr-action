name: Test basic usage with workspace ID and binary version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          scalr_hostname: "example.scalr.io"
          scalr_token: "fake-token-for-testing"
          scalr_workspace: "ws-fake123456"
          binary_version: "1.9.0"
          iac_platform: "terraform"
          binary_wrapper: "false"
      - name: Assert terraform is installed
        run: |
          which terraform || { echo "FAIL: terraform binary not found"; exit 1; }
          echo "PASS: terraform binary found"
      - name: Assert terraform version
        run: |
          VERSION=$(terraform version -json | python3 -c "import sys,json; print(json.load(sys.stdin)['terraform_version'])" 2>/dev/null || terraform version | head -1 | grep -oP '\d+\.\d+\.\d+')
          echo "actual version: $VERSION"
          if [ "$VERSION" != "1.9.0" ]; then
            echo "FAIL: expected version 1.9.0, got $VERSION"
            exit 1
          fi
          echo "PASS: correct terraform version installed"
