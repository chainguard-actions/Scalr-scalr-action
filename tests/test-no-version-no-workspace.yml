name: Test error when no version and no workspace
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          scalr_hostname: "test.scalr.io"
          scalr_token: "test-token-12345"
          # No binary_version and no scalr_workspace — should fail
        continue-on-error: true

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no version and no workspace provided"
            exit 1
          fi
          echo "PASS: action correctly failed when no version and no workspace provided"
