name: Test error when neither version nor workspace provided
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          scalr_hostname: example.scalr.io
          scalr_token: test-scalr-token-123
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure without version or workspace"
            exit 1
          fi
          if command -v terraform >/dev/null 2>&1 && command -v terraform-bin >/dev/null 2>&1; then
            echo "FAIL: terraform wrapper should not be installed"
            exit 1
          fi
          echo "PASS"
