name: Test OpenTofu platform with workspace
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          scalr_hostname: "example.scalr.io"
          scalr_token: "fake-token-for-testing"
          scalr_workspace: "ws-fake123456"
          iac_platform: "tofu"
          binary_version: "1.8.0"
          binary_wrapper: "false"
          binary_output: "false"
        continue-on-error: true
      - name: Assert step ran
        run: |
          echo "PASS: action step completed (continue-on-error)"
