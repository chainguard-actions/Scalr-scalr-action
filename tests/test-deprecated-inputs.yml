name: Test deprecated terraform_version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          scalr_hostname: "example.scalr.io"
          scalr_token: "fake-token-for-testing"
          scalr_workspace: "ws-fake123456"
          terraform_version: "1.8.0"
          iac_platform: "terraform"
          binary_wrapper: "false"
          binary_output: "false"
      - name: Assert action ran with deprecated terraform_version input
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step executed with deprecated terraform_version input"
