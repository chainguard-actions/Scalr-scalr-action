name: Test deprecated terraform_version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          scalr_hostname: "test.scalr.io"
          scalr_token: "fake-token-for-testing"
          terraform_version: "1.5.7"
          terraform_wrapper: "false"
          terraform_output: "false"
      - name: Assert terraform is installed via deprecated input
        run: |
          echo "Checking terraform binary is available (installed via deprecated terraform_version input)..."
          if ! command -v terraform > /dev/null 2>&1; then
            echo "FAIL: terraform binary not found in PATH"
            exit 1
          fi
          echo "PASS: terraform found at $(which terraform)"
      - name: Assert terraform version matches deprecated input
        run: |
          RAW=$(terraform version | head -1)
          echo "raw version output: $RAW"
          VERSION=$(echo "$RAW" | sed 's/.*v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*/\1/')
          echo "actual version: $VERSION"
          if [ "$VERSION" != "1.5.7" ]; then
            echo "FAIL: expected terraform version 1.5.7, got $VERSION"
            exit 1
          fi
          echo "PASS: terraform version is $VERSION"
      - name: Assert TF_IN_AUTOMATION is set
        run: |
          echo "TF_IN_AUTOMATION=$TF_IN_AUTOMATION"
          if [ -z "$TF_IN_AUTOMATION" ]; then
            echo "FAIL: TF_IN_AUTOMATION is not set"
            exit 1
          fi
          echo "PASS: TF_IN_AUTOMATION is set to $TF_IN_AUTOMATION"
