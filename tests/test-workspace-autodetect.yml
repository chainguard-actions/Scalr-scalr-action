name: Test workspace with version autodetect
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          scalr_hostname: "example.scalr.io"
          scalr_token: "fake-token-for-testing"
          scalr_workspace: "ws-fake123456"
          iac_platform: "terraform"
          binary_version: "1.8.0"
          binary_wrapper: "false"
        continue-on-error: true
      - name: Assert terraform binary is installed
        run: |
          if command -v terraform &>/dev/null; then
            echo "PASS: terraform binary found"
            terraform version
          else
            echo "FAIL: terraform binary not found"
            exit 1
          fi
