name: Test invalid binary_version triggers error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          scalr_hostname: "test.scalr.io"
          scalr_token: "test-token-12345"
          iac_platform: "terraform"
          binary_version: "latest"

      - name: Assert action failed with expected error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when binary_version=latest, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when binary_version=latest"
