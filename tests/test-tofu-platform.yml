name: Test OpenTofu platform usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          scalr_hostname: "example.scalr.io"
          scalr_token: "fake-token-for-testing"
          iac_platform: "tofu"
          binary_version: "1.6.2"
          binary_wrapper: "false"
      - name: Assert tofu is installed
        run: |
          echo "Checking tofu binary is available..."
          if ! command -v tofu &>/dev/null; then
            echo "FAIL: tofu binary not found in PATH"
            exit 1
          fi
          VERSION=$(tofu version | head -1)
          echo "Installed version: $VERSION"
          echo "PASS: tofu is installed"
