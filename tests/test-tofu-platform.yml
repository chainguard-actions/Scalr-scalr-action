name: Test OpenTofu platform usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          scalr_hostname: "example.scalr.io"
          scalr_token: "fake-token-for-testing"
          scalr_workspace: "ws-fake123456"
          iac_platform: "tofu"
          binary_version: "1.6.2"
          binary_wrapper: "false"
          binary_output: "false"
        continue-on-error: true
      - name: Assert tofu binary installed
        run: |
          echo "Checking if tofu binary is available..."
          if command -v tofu >/dev/null 2>&1; then
            echo "PASS: tofu binary found"
            tofu version
          else
            echo "FAIL: tofu binary not found"
            exit 1
          fi
