name: Test usage with workspace name and environment name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          scalr_hostname: example.scalr.io
          scalr_token: fake-token-for-testing
          scalr_workspace_name: my-workspace
          scalr_environment_name: my-environment
          iac_platform: terraform
          binary_wrapper: "false"
          binary_output: "false"
        continue-on-error: true
      - name: Assert action ran with workspace name and environment name inputs
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step executed with scalr_workspace_name and scalr_environment_name inputs"
