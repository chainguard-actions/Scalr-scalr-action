name: Test scalr_workspace input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          scalr_hostname: "test.scalr.io"
          scalr_token: "fake-scalr-token"
          scalr_workspace: "ws-abc123"
          iac_platform: "terraform"
          binary_wrapper: "false"
      - name: Assert action ran with workspace input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will fail because the scalr credentials are fake,
          # but it must have attempted to use the scalr_workspace input.
          # We accept either success (unlikely with fake creds) or failure
          # (expected with fake creds), but not a skipped step.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with scalr_workspace input (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
