name: Test terraform setup without wrapper
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          scalr_hostname: "test.scalr.io"
          scalr_token: "fake-token-for-testing"
          iac_platform: "terraform"
          binary_version: "1.8.5"
          binary_wrapper: "false"

      - name: Assert terraform is installed without wrapper
        run: |
          echo "Checking terraform binary is available..."
          which terraform || { echo "FAIL: terraform binary not found in PATH"; exit 1; }
          echo "Running terraform version directly (no wrapper)..."
          terraform version
          echo "PASS: terraform runs directly without wrapper"

      - name: Assert terraform version matches requested
        run: |
          TF_VERSION=$(terraform version | head -1)
          echo "Installed version: $TF_VERSION"
          if echo "$TF_VERSION" | grep -q "1.8.5"; then
            echo "PASS: correct terraform version installed"
          else
            echo "FAIL: expected version 1.8.5, got: $TF_VERSION"
            exit 1
          fi
